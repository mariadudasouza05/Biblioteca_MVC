<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Autor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<h1 th:text="${autor.id == null ? 'Cadastrar Novo Autor' : 'Editar Autor'}">Autor</h1>

<form th:action="@{/autores/salvar}" th:object="${autor}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" required />
    </div>

    <div class="form-group">
        <label for="nacionalidade">Nacionalidade:</label>
        <input type="text" id="nacionalidade" th:field="*{nacionalidade}" required />
    </div>

    <button type="submit"
            th:text="${autor.id == null ? 'Salvar Autor' : 'Atualizar Autor'}">
        Salvar
    </button>
</form>

<br>
<a th:href="@{/autores}">Voltar para a Lista</a>

</body>
</html>
