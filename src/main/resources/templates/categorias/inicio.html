
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Categorias</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn {display: inline-block;padding: 8px 12px;background-color: #007bff;color: white;text-decoration: none;border-radius: 4px;border: none;cursor: pointer;}
        .btn-danger {background-color: #dc3545;}
    </style>
</head>
<body>

<h1>Gestão de Categorias</h1>

<a th:href="@{/categorias/novo}" class="btn">Cadastrar Nova Categoria</a>

<table>
    <thead>
    <tr>
        <th>Nome da Categoria</th>
        <th>Excluir</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${categorias}">
        <td th:text="${a.nomeCategoria}">Nome da Categoria</td>
        <td>
            <form th:action="@{/categorias/excluir/{id}(id=${a.id})}"
                  method="post">
                <button type="submit" class="btn btn-danger">
                    Excluir
                </button>
            </form>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(categorias)}">
        <td colspan="3">Nenhuma categoria cadastrada até o momento.</td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/}">Voltar para a Página Inicial</a>

</body>
</html>
