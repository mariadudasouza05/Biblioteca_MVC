<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Livros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .btn { display: inline-block; padding: 8px 12px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>

<h1>Gestão de Livros</h1>

<a th:href="@{/livros/novo}" class="btn">Cadastrar Novo Livro</a>

<table>
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ano de Publicação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="l : ${livros}">
        <td th:text="${l.titulo}">Título</td>
        <td th:text="${l.autor}">Autor</td>
        <td th:text="${l.isbn}">ISBN</td>
        <td th:text="${l.anoPublicacao}">Ano</td>
    </tr>
    <tr th:if="${#lists.isEmpty(livros)}">
        <td colspan="4">Nenhum livro cadastrado até o momento.</td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/}">Voltar para a Página Inicial</a>

</body>
</html>
