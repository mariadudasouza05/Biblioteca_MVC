<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 300px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<h1>Cadastrar Novo Livro</h1>

<form th:action="@{/livros/salvar}" th:object="${livro}" method="post">
    <div class="form-group">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" th:field="*{titulo}" required />
    </div>

    <div class="form-group">
        <label for="autor">Autor:</label>
        <input type="text" id="autor" th:field="*{autor}" required />
    </div>

    <div class="form-group">
        <label for="isbn">ISBN:</label>
        <input type="text" id="isbn" th:field="*{isbn}" required />
    </div>

    <div class="form-group">
        <label for="anoPublicacao">Ano de Publicação:</label>
        <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}" required />
    </div>

    <button type="submit">Salvar Livro</button>
</form>

<br>
<a th:href="@{/livros}">Voltar para a Lista</a>

</body>
</html>
